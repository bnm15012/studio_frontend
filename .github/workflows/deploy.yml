name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_APP_REST_API: ${{ secrets.VITE_APP_REST_API }}
          VITE_APP_REST_API_KEY: ${{ secrets.VITE_APP_REST_API_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
