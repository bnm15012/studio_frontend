name: Build and Push Docker Image

on:
  push:
    branches:
      - docker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: bookandmanage/studio-app:latest
          build-args: |
            VITE_APP_REST_API=${{ secrets.VITE_APP_REST_API }}
            VITE_APP_RAZOR_PAY_KEY=${{ secrets.VITE_APP_RAZOR_PAY_KEY }}
            VITE_APP_FORM_SIG=${{ secrets.VITE_APP_FORM_SIG }}
            VITE_DEBUG=${{ secrets.VITE_DEBUG }}